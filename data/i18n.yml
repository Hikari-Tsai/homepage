  zh: "使用強力錄音室SSL 4000系列進行硬體混音(<b>不</b>包含Vocal Edit&Tuning) <span class=\"badge bg-primary rounded-pill\">贈母帶後期</span>"
  en: "Hardware mix on the SSL 4000 series console at 強力錄音室 (does <b>not</b> include Vocal Edit &amp; Tuning) <span class=\"badge bg-primary rounded-pill\">Free mastering</span>"
  ja: "強力錄音室のSSL 4000シリーズでのハードウェアミックス（Vocal Edit &amp; Tuningは<b>含みません</b>） <span class=\"badge bg-primary rounded-pill\">マスタリング無料</span>"

contact.23:
  zh: "錄音室(現場)、線上傳檔、線上同步"
  en: "In studio, online upload, live online session"
  ja: "スタジオ（対面）・オンライン送付・オンライン同時試聴"

contact.25:
  zh: "填寫表單確認需求與報價"
  en: "Fill in the Form for Requirements &amp; a Quote"
  ja: "フォームでご要望の確認とお見積もり"

contact.26:
  zh: "根據混音形態不同，價格也有不同，大致上可以分為Vocal Mix、Multitrack Full Mix and SSL Full Mixing"
  en: "Prices vary by type of mix, roughly divided into Vocal Mix, Multitrack Full Mix and SSL Full Mixing."
  ja: "料金はミックスの種類によって異なり、主にVocal Mix、Multitrack Full Mix、SSL Full Mixingに分かれます。"

contact.27:
  zh: "<b>[Vocal Mix]</b> 僅有一軌卡拉帶加上Vocals，Vocals不限數量與分軌"
  en: "<b>[Vocal Mix]</b> One instrumental track plus vocals; unlimited vocal tracks and stems"
  ja: "<b>[Vocal Mix]</b> インスト1トラック＋ボーカル。ボーカルのトラック数・パラデータは無制限"

contact.28:
  zh: "<b>[Multitracks Full Mix]</b> 多軌道分軌混音，通常是原創曲或是重編曲之作品(不贈送錄音)"
  en: "<b>[Multitracks Full Mix]</b> Multitrack stem mixing, usually for original songs or new arrangements (recording not included)"
  ja: "<b>[Multitracks Full Mix]</b> マルチトラックのパラデータミックス。主にオリジナル曲やリアレンジ作品向け（録音は含みません）"

contact.29:
  zh: "<b>[SSL Full Mix]</b> 使用強力錄音室SSL 4000系列進行硬體混音，可現場聽咪或是遠端聽咪"
  en: "<b>[SSL Full Mix]</b> Hardware mix on the SSL 4000 series at 強力錄音室; review in person or remotely"
  ja: "<b>[SSL Full Mix]</b> 強力錄音室のSSL 4000シリーズでハードウェアミックス。立ち会いでもリモートでも確認できます"

contact.30:
  zh: "填寫表單"
  en: "Fill in the form"
  ja: "フォームに入力"

contact.31:
  zh: "準備檔案與錄音"
  en: "Preparing Files &amp; Recording"
  ja: "ファイルの準備と録音"

contact.32:
  zh: "<b>[Vocal Mix]</b>請提供齊頭卡拉帶與Vocal錄音分軌(若由Hikari錄音則不需提供分軌)"
  en: "<b>[Vocal Mix]</b> Please provide the instrumental and vocal stems, all starting from the same point (not needed if Hikari records the vocals)"
  ja: "<b>[Vocal Mix]</b> 頭揃えしたインストとボーカルのパラデータをご用意ください（Hikariが録音する場合は不要です）"

contact.33:
  zh: "<b>[Multitracks Full Mix]</b> 請準備24bits, 48kHz的分軌檔案，檔案齊頭，可接受ProTools Session檔案"
  en: "<b>[Multitracks Full Mix]</b> Please prepare 24-bit / 48 kHz stems, all starting from the same point. Pro Tools sessions are accepted."
  ja: "<b>[Multitracks Full Mix]</b> 24bit／48kHzのパラデータを頭揃えでご用意ください。Pro Toolsのセッションファイルにも対応しています。"

contact.34:
  zh: "<b>[SSL Full Mix]</b> 請準備24bits, 48kHz的分軌檔案，檔案齊頭，可接受ProTools Session檔案"
  en: "<b>[SSL Full Mix]</b> Please prepare 24-bit / 48 kHz stems, all starting from the same point. Pro Tools sessions are accepted."
  ja: "<b>[SSL Full Mix]</b> 24bit／48kHzのパラデータを頭揃えでご用意ください。Pro Toolsのセッションファイルにも対応しています。"

contact.35:
  zh: "聽咪方式"
  en: "How to Review"
  ja: "確認方法"

contact.36:
  zh: "<b>[線上非同步]</b> 標準，所有混音方案都可以使用。"
  en: "<b>[Online, asynchronous]</b> Standard; available for every mixing plan."
  ja: "<b>[オンライン（非同期）]</b> 標準。すべてのプランで利用できます。"

contact.37:
  zh: "<b>[線上同步]</b> 提供專用網址遠端高音質同步聽取檔案，現場修改，僅限Multitracks Full Mix方案或是SSL Full Mix方案"
  en: "<b>[Online, live]</b> Listen together in high quality through a dedicated link while changes are made in real time. Multitracks Full Mix or SSL Full Mix plans only."
  ja: "<b>[オンライン（同時）]</b> 専用URLで高音質の音声を同時に聴きながら、その場で修正します。Multitracks Full MixまたはSSL Full Mixプランのみ。"

contact.38:
  zh: "<b>[實體錄音室]</b> 於強力錄音室現場聽咪，僅限SSL Full Mix"
  en: "<b>[In studio]</b> Review in person at 強力錄音室. SSL Full Mix only."
  ja: "<b>[スタジオ立ち会い]</b> 強力錄音室で立ち会って確認。SSL Full Mixのみ。"

contact.39:
  zh: "檔案交付"
  en: "Delivery"
  ja: "納品"

contact.40:
  zh: "<b>[Vocal Mix]</b>交付MMM(混音)檔案，若有和聲則會另外交付MMO(含有和聲的卡拉帶)，並提供MP3, Wavs, AIFF三種格式下載。"
  en: "<b>[Vocal Mix]</b> Delivered as an MMM (full mix) file, plus an MMO (instrumental with backing vocals) if there are harmonies; downloadable as MP3, WAV and AIFF."
  ja: "<b>[Vocal Mix]</b> MMM（ミックス）ファイルを納品します。ハモリがある場合はMMO（ハモリ入りカラオケ）も別途納品し、MP3・WAV・AIFFの3形式でダウンロードできます。"

contact.41:
  zh: "<b>[Multitracks Full Mix]</b> 交付標準MMM, MMA以及MMO三種檔案，並提供MP3, Wavs, AIFF三種格式下載。"
  en: "<b>[Multitracks Full Mix]</b> Delivered as the standard MMM, MMA and MMO files; downloadable as MP3, WAV and AIFF."
  ja: "<b>[Multitracks Full Mix]</b> 標準のMMM・MMA・MMOの3種類を納品し、MP3・WAV・AIFFの3形式でダウンロードできます。"

contact.42:
  zh: "在此希望能與您約定，我會全力完成委託，若有任何問題或是需要修改的地方，也請在一週內提出修改需求，若超過一週則會視為確認結案(有任何執行上的困難都可以討論但不要放半年一年都不結案)。"
  en: "One request: I'll put everything into your project, so please send any questions or revisions within one week. After one week the project will be considered complete. (If anything makes that hard, let's talk — just please don't leave a project open for six months or a year.)"
  ja: "ひとつお願いがあります。ご依頼には全力で取り組みますので、ご質問や修正のご要望は1週間以内にお知らせください。1週間を過ぎた場合は完了とさせていただきます。（事情がある場合はご相談ください。ただ、半年や1年も完了しないままにするのはご遠慮ください。）"

contact.43:
  zh: "付款"
  en: "Payment"
  ja: "お支払い"

contact.44:
  zh: "結案後請於一週內支付全部款項"
  en: "Please pay the full amount within one week after the project is completed."
  ja: "完了後1週間以内に全額をお支払いください。"

