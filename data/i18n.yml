  zh: "這邊的Remix不是指電音DJ混音，而是擷取實況內容做音訊分離與標準的音樂製作流程後，重製成爲接近發行的水準，基本上都是二創。"
  en: "“Remix” here doesn't mean a DJ remix: I take stream footage, separate the audio and run it through a standard music production workflow to rebuild it at near-release quality. They're basically fan works."
  ja: "ここでいうRemixはDJのリミックスではありません。配信の素材から音声を分離し、通常の音楽制作フローで仕上げ直して、リリースに近いクオリティまで作り直したものです。基本的には二次創作です。"

