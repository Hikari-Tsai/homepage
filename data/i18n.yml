hero.02:
  zh: "Recording, Mixing & ML Engineer"
  en: "Recording, Mixing &amp; ML Engineer"
  ja: "レコーディング・ミキシング＆MLエンジニア"

hero.03:
  zh: "Hi, 我是Hikari，一個喜歡獨立音樂人、混音師以及軟體工程師。曾與陳芳語(Kimberly)、隕浮流(Verbal)、林鴻鳴(星光二班)以及黃小玫等多位藝人合作，為音樂串流公司訓練芒果醬、黃明志等藝人的演唱模型。同時也是一個鍵盤手，多次參加墾丁春天吶喊、海洋音樂祭以及公共電視演出，並為國外知名金屬樂團如 graveworm, leaves' eyes, Traja（Nightwish主唱）開場演出。設計多種獲獎產品。<br> 相較於自己站在舞台上，我更喜歡看著別人成功，如果有音樂的問題，歡迎來找我討論吧！"
  en: "Hi, I'm Hikari — an indie musician, mixing engineer, and software engineer. I've worked with many artists, including Kimberly Chen (陳芳語), Verbal (隕浮流), 林鴻鳴 (One Million Star, Season 2) and Sandy Huang (黃小玫), and trained singing-voice models of artists such as Mango Jump and Namewee for a music streaming company. I'm also a keyboardist who has played Spring Scream, the Ho-Hai-Yan Rock Festival and shows on Taiwan's Public Television, and opened for international metal acts such as Graveworm, Leaves' Eyes and Tarja (Nightwish). I've also designed several award-winning products.<br> Rather than standing on stage myself, I'd rather watch others succeed. If you have any questions about music, feel free to reach out!"
  ja: "こんにちは、Hikariです。インディーミュージシャン、ミキシングエンジニア、そしてソフトウェアエンジニアです。陳芳語（Kimberly）、隕浮流（Verbal）、林鴻鳴（『超級星光大道』第2期）、黃小玫など多くのアーティストと仕事をしてきたほか、音楽ストリーミング企業で芒果醬（Mango Jump）や黃明志（Namewee）などの歌声モデルの学習も手がけました。キーボーディストとして墾丁「春天吶喊（Spring Scream）」、貢寮海洋音楽祭、台湾公共テレビに出演し、Graveworm、Leaves' Eyes、Tarja（Nightwish）など海外の有名メタルアーティストのオープニングアクトも務めました。受賞歴のあるプロダクトも複数デザインしています。<br> 自分がステージに立つよりも、誰かが成功するのを見るほうが好きです。音楽のことで困ったら、気軽に相談してください！"

services.01:
  zh: "We truly enjoy working on music production—whether it’s Mixing, Recording, or Composing—just as much as you need these services. This allows us to help you achieve your musical goals more effortlessly. Feel free to explore the wide range of music production services we offer."
  en: "We truly enjoy working on music production—whether it’s Mixing, Recording, or Composing—just as much as you need these services. This allows us to help you achieve your musical goals more effortlessly. Feel free to explore the wide range of music production services we offer."
  ja: "ミキシング、レコーディング、作曲――音楽制作のあらゆる場面で、私たちは音楽づくりを心から楽しんでいます。だからこそ、あなたの音楽の目標をもっとスムーズに実現するお手伝いができます。幅広い音楽制作サービスをぜひご覧ください。"

