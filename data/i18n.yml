  en: "蘇育霆, Singer / Producer"
  ja: "蘇育霆（歌手／プロデューサー）"

services.23:
  zh: "華研國際音樂有限公司"
  en: "HIM International Music"
  ja: "華研國際音樂（HIM International Music）"

services.24:
  zh: "Hikari是業界速度快、且將音樂視為珍貴原創商品的配樂音效公司。無論是合作案的大小或性質，他們都會以相同的敬業態度完成工作。創業的路上總是比較辛苦，我很幸運有這樣能夠相互扶持的夥伴一同前進、慢慢地一同站穩腳步。"
  en: "Hikari is a fast-moving music and sound studio that treats music as a precious original creation. Whatever the size or nature of the project, they bring the same professionalism to every job. Building a business is never easy, and I'm lucky to have partners like them to move forward with and find our footing together."
  ja: "Hikariは業界でも仕事が早く、音楽を大切なオリジナル作品として扱う音楽・音響制作チームです。案件の規模や内容にかかわらず、いつも同じ誠実さで仕事をしてくれます。起業の道は大変なことばかりですが、支え合いながら一緒に歩んでいけるパートナーに出会えて幸運です。"

services.25:
  zh: "張偉翰(小馬) 導演"
  en: "張偉翰 (小馬), Director"
  ja: "張偉翰（小馬）監督"

services.27:
  zh: "Hikari在音樂製作上展現了高度的專業，不論是在編曲或是混音方面，總是很精準地完成我要的東西，他們總是很有耐心地詢問你的需求並盡力做到完美一致，對於音樂方面的大小事，我放心把自己交給他們。"
  en: "Hikari shows real professionalism in music production. Whether arranging or mixing, he always delivers exactly what I'm after. He patiently asks about your needs and does his best to get everything just right — I'm happy to trust him with anything music-related."
  ja: "Hikariさんは音楽制作において非常に高いプロ意識を持っています。編曲でもミックスでも、いつもこちらの求めるものを的確に形にしてくれます。要望を根気よく聞き取り、完璧に仕上げようと尽力してくれるので、音楽のことは安心して任せられます。"

