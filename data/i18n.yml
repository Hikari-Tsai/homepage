services.30:
  zh: "謝謝Hikari的大力支持，協助本計畫將深奧難懂的雲南麗江納西族的東巴經文錄音工作，順利完成。小光老師認真細心的敬業精神，值得推薦給大家～"
  en: "Many thanks to Hikari for his great support in helping our project complete the difficult recording of Dongba scriptures of the Naxi people of Lijiang, Yunnan. His careful, dedicated professionalism is something I highly recommend."
  ja: "雲南省麗江のナシ族に伝わる難解なトンパ経典の録音作業を、本プロジェクトのために無事完了させてくださったHikariさんの多大なご協力に感謝します。真摯で丁寧な仕事ぶりは、自信を持っておすすめできます。"

