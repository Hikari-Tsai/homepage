services.10:
  zh: "對於行外人也友善！委託音樂相關的東西的時候，都會因為相關知識匱乏，在溝通的時候會很緊張。但是Hikari都會很詳細的解釋相關的東西！效率高又能符合期望，真的很棒！"
  en: "Friendly even to non-experts! I always get nervous commissioning music work because I know so little about it, but Hikari explains everything in detail. Fast, efficient and exactly what I hoped for — really great!"
  ja: "専門外の人にも優しいです！音楽関係の依頼は知識がなくて緊張してしまうのですが、Hikariさんはいつも丁寧に説明してくれます。仕事が早く、期待通りの仕上がりで本当に最高です！"

services.13:
  zh: "小光老師製作效率很高，也會給出具體的協助與指導，溝通也都很順暢，交給他每次真的都可以順利拿到好作品…！"
  en: "Hikari works very efficiently and gives concrete help and guidance. Communication is always smooth, and every time I get a great result…!"
  ja: "小光先生は制作がとても早く、具体的なサポートやアドバイスもくれます。やり取りもスムーズで、毎回素晴らしい作品に仕上げてくれます…！"

services.15:
  zh: "Hikari老師專業細心！對於第一次宅錄有許多不懂的地方也會耐心溝通，並且會跟進客戶的要求和歌曲本身完成作品！最後成品也十分滿意，非常感謝老師！(*òωó _)"
  en: "Hikari is professional and attentive! It was my first time recording at home and I didn't know much, but he patiently talked me through everything and finished the work following both my requests and the song itself. I'm very happy with the result — thank you so much! (*òωó _)"
  ja: "Hikari先生はプロフェッショナルで丁寧です！初めての宅録で分からないことだらけでしたが、根気よく相談に乗ってくれて、こちらの要望と曲そのものに寄り添って仕上げてくれました。完成品にも大満足です。本当にありがとうございました！(*òωó _)"

services.18:
  zh: "與Hikari配合過數支商用影片，對於高品質的配樂製作與英文旁白印象深刻，配合度高且容易溝通"
  en: "We've worked with Hikari on several commercial videos and were impressed by the high-quality scoring and English narration. Very cooperative and easy to communicate with."
  ja: "Hikariさんとは複数の商業映像でご一緒しました。高品質な劇伴制作と英語ナレーションが印象的で、柔軟に対応してくれてコミュニケーションも取りやすいです。"

services.19:
  zh: "顏小八 導演"
  en: "顏小八, Director"
  ja: "顏小八（監督）"

services.21:
  zh: "Hikari在專輯製作上幫我很多忙，非常願意花很多時間和我溝通確定我要什麼，最後也很專業和負責地幫我完成我想要的成品，總之很感謝他們！"
  en: "Hikari helped me a lot with my album. He was willing to spend plenty of time with me to pin down exactly what I wanted, and finished the work professionally and responsibly. I'm truly grateful!"
  ja: "アルバム制作で本当にたくさん助けてもらいました。私が何を求めているのか時間をかけて丁寧に確認してくれ、最後までプロとして責任を持って仕上げてくれました。心から感謝しています！"

